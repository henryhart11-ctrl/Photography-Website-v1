<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMACK PRODUCTIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HMACK PRODUCTIONS — config-at-a-glance
   Search "EDIT ME" to find every place you'll want to swap in
   your own photos, handle, and dates.
   ============================================================ */

:root{
  --void:      #0a0907;
  --panel:     #131009;
  --panel-2:   #1c1710;
  --bronze:    #b6905a;
  --bronze-lt: #e3c48f;
  --bronze-dim:#6b5230;
  --blood:     #4a0e0e;
  --bone:      #ffffff;
  --bone-dim:  #cfcfcf;
  --line:      rgba(182,144,90,0.22);

  --xgreen:    #8cff3a;
  --xgreen-dim:#173809;
  --xgreen-glow: rgba(140,255,58,0.55);

  --display: 'Pirata One', serif;
  --body: 'Cormorant Garamond', serif;
  --mono: 'Share Tech Mono', monospace;

  --ease: cubic-bezier(.16,.8,.28,1);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--void);
  color:var(--bone);
  font-family:var(--body);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

::selection{background:var(--bronze-dim);color:var(--bone-lt);}

/* focus visibility, kept even though we style everything else by hand */
a:focus-visible, button:focus-visible{
  outline:2px solid var(--bronze-lt);
  outline-offset:3px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
}

/* ---------- shared texture ---------- */
.grain{
  position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.vignette{
  position:fixed; inset:0; pointer-events:none; z-index:4;
  background:radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(0,0,0,0.55) 100%);
}

/* ============================================================
   HEADER / NAV
   ============================================================ */
header.site{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:22px clamp(18px,4vw,48px);
  background:linear-gradient(to bottom, rgba(10,9,7,0.92), rgba(10,9,7,0));
  transition:background .3s var(--ease);
}
.brand{
  font-family:var(--display);
  font-size:clamp(20px,2.4vw,30px);
  letter-spacing:1.5px;
  color:var(--bone);
  text-shadow:0 0 18px rgba(255,255,255,0.25);
  white-space:nowrap;
  cursor:pointer;
}
nav.primary{
  display:flex; gap:clamp(18px,3vw,40px);
  font-size:13px; letter-spacing:3px; text-transform:uppercase;
  font-family:var(--body); font-weight:600;
}
nav.primary a{
  position:relative; padding:6px 2px; color:var(--bone-dim);
  transition:color .25s var(--ease);
}
nav.primary a::after{
  content:''; position:absolute; left:0; right:100%; bottom:0; height:1px;
  background:var(--bronze-lt); transition:right .3s var(--ease);
}
nav.primary a:hover, nav.primary a.active{color:var(--bone);}
nav.primary a:hover::after, nav.primary a.active::after{right:0;}

.burger{
  display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; z-index:110;
}
.burger span{width:26px; height:1px; background:var(--bronze-lt); display:block;}

@media (max-width:760px){
  nav.primary{
    position:fixed; inset:0; background:rgba(8,7,5,0.98);
    flex-direction:column; align-items:center; justify-content:center;
    gap:34px; font-size:16px;
    transform:translateY(-100%); transition:transform .4s var(--ease);
  }
  nav.primary.open{transform:translateY(0);}
  .burger{display:flex;}
}

/* ============================================================
   VIEW SWITCHING (single page, hash-routed sections)
   ============================================================ */
.view{
  min-height:100vh; width:100%;
  opacity:0; visibility:hidden; position:absolute; top:0; left:0;
  transition:opacity .55s var(--ease);
}
.view.active{
  opacity:1; visibility:visible; position:relative;
}

/* ============================================================
   HOME
   ============================================================ */
#view-home{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  min-height:100vh;
  background:
    radial-gradient(ellipse 60% 50% at 50% 28%, rgba(182,144,90,0.10), transparent 70%),
    radial-gradient(ellipse 90% 60% at 50% 100%, rgba(74,14,14,0.18), transparent 70%),
    var(--void);
  position:relative;
  padding-top:120px;
}

.hero-eyebrow{
  font-family:var(--body); font-style:italic; font-weight:400;
  letter-spacing:4px; text-transform:uppercase; font-size:12px;
  color:var(--bone-dim); margin-bottom:6px;
}

.statue-wrap{
  position:relative;
  width:min(64vw, 480px);
  margin-top:6px;
}
.statue-wrap img{
  width:100%; height:auto;
  filter:drop-shadow(0 30px 60px rgba(0,0,0,0.7));
  animation:rise 1.6s var(--ease) both;
}
@keyframes rise{
  from{opacity:0; transform:translateY(26px);}
  to{opacity:1; transform:translateY(0);}
}

/* the offering — floating slideshow held above the statue's hands */
.offering{
  position:absolute;
  left:50%; top:37.5%;
  width:58%;
  aspect-ratio:4/3;
  transform:translate(-50%,-50%) perspective(600px) rotateX(6deg);
  border:1px solid var(--line);
  background:var(--panel);
  box-shadow:
    0 0 0 1px rgba(182,144,90,0.08),
    0 20px 50px rgba(0,0,0,0.65),
    0 0 60px rgba(182,144,90,0.18);
  overflow:hidden;
  animation:hover-float 6s ease-in-out infinite, hero-in 1.9s var(--ease) both;
}
@keyframes hero-in{ from{opacity:0; transform:translate(-50%,-42%) perspective(600px) rotateX(6deg);} to{opacity:1; transform:translate(-50%,-50%) perspective(600px) rotateX(6deg);} }
@keyframes hover-float{
  0%,100%{ transform:translate(-50%,-50%) perspective(600px) rotateX(6deg) translateY(0); }
  50%{ transform:translate(-50%,-50%) perspective(600px) rotateX(6deg) translateY(-6px); }
}
.offering::before{
  content:''; position:absolute; inset:0; z-index:3; pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(140,255,58,0) 0px, rgba(255,255,255,0.03) 1px, rgba(140,255,58,0) 2px);
  mix-blend-mode:overlay;
}
.offering::after{
  content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
  box-shadow:inset 0 0 30px rgba(0,0,0,0.7);
}
.offering .slide{
  position:absolute; inset:0;
  background-size:cover; background-position:center;
  opacity:0;
  transition:opacity 1.6s ease-in-out;
}
.offering .slide.showing{opacity:1;}
.offering-caption{
  position:absolute; bottom:8px; left:12px; z-index:4;
  font-family:var(--mono); font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:var(--bone); opacity:0.75;
}

.hero-title{
  font-family:var(--display);
  font-size:clamp(30px,5vw,52px);
  color:var(--bone);
  text-align:center;
  margin:38px 0 6px;
  text-shadow:0 0 30px rgba(255,255,255,0.2);
  animation:fade-up 1.2s .4s var(--ease) both;
}
.hero-sub{
  font-family:var(--body); font-style:italic; font-weight:400;
  color:var(--bone-dim); text-align:center; font-size:clamp(14px,1.6vw,18px);
  letter-spacing:0.5px; margin-bottom:56px;
  animation:fade-up 1.2s .55s var(--ease) both;
}
@keyframes fade-up{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

/* countdown HUD, upper-left, xbox-green to match the album page */
.hud{
  position:fixed; top:96px; left:clamp(16px,3vw,40px); z-index:60;
  border:1px solid rgba(140,255,58,0.35);
  background:rgba(6,10,4,0.55);
  backdrop-filter:blur(3px);
  padding:12px 16px;
  box-shadow:0 0 26px rgba(140,255,58,0.12), inset 0 0 20px rgba(140,255,58,0.05);
  font-family:var(--mono);
  animation:hud-in 1s .8s var(--ease) both;
}
@keyframes hud-in{ from{opacity:0; transform:translateX(-10px);} to{opacity:1; transform:translateX(0);} }
.hud-label{
  font-size:10px; letter-spacing:3px; text-transform:uppercase;
  color:var(--xgreen); opacity:0.85; margin-bottom:8px;
  display:flex; align-items:center; gap:7px;
}
.hud-label .dot{
  width:6px; height:6px; border-radius:50%; background:var(--xgreen);
  box-shadow:0 0 8px 2px var(--xgreen-glow);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
.hud-grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
}
.hud-unit{text-align:center;}
.hud-num{
  font-size:clamp(18px,2.4vw,24px); color:var(--xgreen);
  text-shadow:0 0 12px var(--xgreen-glow);
}
.hud-unitlabel{
  font-size:8px; letter-spacing:2px; color:rgba(140,255,58,0.6); margin-top:2px;
}

.scroll-cue{
  margin:0 0 26px; font-family:var(--mono); font-size:10px; letter-spacing:3px;
  color:var(--bone-dim); text-transform:uppercase; display:flex; flex-direction:column; align-items:center; gap:6px;
  animation:fade-up 1.2s .8s var(--ease) both;
}
.scroll-cue span{
  width:1px; height:22px; background:linear-gradient(var(--bronze),transparent);
  animation:cue 1.8s ease-in-out infinite;
}
@keyframes cue{ 0%{transform:scaleY(0.4); opacity:0.3;} 50%{transform:scaleY(1); opacity:1;} 100%{transform:scaleY(0.4); opacity:0.3;} }

@media (max-width:760px){
  .hud{ position:absolute; top:90px; left:50%; transform:translateX(-50%); width:min(84vw,320px); }
  @keyframes hud-in{ from{opacity:0; transform:translate(-50%,-10px);} to{opacity:1; transform:translate(-50%,0);} }
  #view-home{padding-top:190px;}
  .statue-wrap{width:78vw;}
}

/* ============================================================
   ALBUMS  — Xbox-dashboard-inspired blade list
   ============================================================ */
#view-albums{
  min-height:100vh;
  background:
    radial-gradient(ellipse 70% 50% at 8% 15%, rgba(140,255,58,0.10), transparent 60%),
    #050704;
  padding:150px clamp(18px,6vw,90px) 80px;
  position:relative;
}
.hexfield{
  position:absolute; inset:0; z-index:0; opacity:0.14; pointer-events:none;
  background-image:
    linear-gradient(30deg, transparent 24%, rgba(140,255,58,.35) 25%, rgba(140,255,58,.35) 26%, transparent 27%, transparent 74%, rgba(140,255,58,.35) 75%, rgba(140,255,58,.35) 76%, transparent 77%),
    linear-gradient(150deg, transparent 24%, rgba(140,255,58,.35) 25%, rgba(140,255,58,.35) 26%, transparent 27%, transparent 74%, rgba(140,255,58,.35) 75%, rgba(140,255,58,.35) 76%, transparent 77%),
    linear-gradient(90deg, transparent 49%, rgba(140,255,58,.25) 50%, transparent 51%);
  background-size:64px 110px;
}
.orb{
  position:absolute; top:150px; left:clamp(18px,6vw,90px);
  width:120px; height:120px; border-radius:50%; z-index:0;
  background:radial-gradient(circle at 35% 30%, #d4ffb0, var(--xgreen) 40%, #2b6b12 75%, #0c1c05 100%);
  box-shadow:0 0 60px 10px rgba(140,255,58,0.35), inset 0 0 30px rgba(0,0,0,0.4);
  animation:orb-spin 14s linear infinite, orb-in 1s var(--ease) both;
  opacity:0.9;
}
@keyframes orb-spin{ from{filter:hue-rotate(0deg);} to{filter:hue-rotate(25deg);} }
@keyframes orb-in{ from{opacity:0; transform:scale(0.6);} to{opacity:0.9; transform:scale(1);} }

.albums-head{
  position:relative; z-index:1; margin-bottom:56px; margin-left:clamp(0px,0vw,10px);
  padding-left:170px;
}
.albums-head h1{
  font-family:var(--display); font-size:clamp(30px,4.4vw,46px);
  color:var(--xgreen); text-shadow:0 0 24px rgba(140,255,58,0.35); margin:0 0 8px;
}
.albums-head p{
  font-family:var(--mono); font-size:12px; letter-spacing:2px; color:rgba(140,255,58,0.55); margin:0; text-transform:uppercase;
}
@media (max-width:640px){
  .orb{width:74px; height:74px; top:140px; left:16px;}
  .albums-head{padding-left:0; margin-top:70px;}
}

.blades{
  position:relative; z-index:1;
  display:flex; flex-direction:column;
  border-top:1px solid rgba(140,255,58,0.18);
}
.blade{
  border-bottom:1px solid rgba(140,255,58,0.18);
  cursor:pointer;
}
.blade-row{
  display:flex; align-items:center; gap:22px;
  padding:22px 10px 22px 148px;
  position:relative;
  transition:background .3s var(--ease), padding-left .3s var(--ease);
}
.blade-row:hover, .blade.open .blade-row{
  background:linear-gradient(90deg, rgba(140,255,58,0.08), transparent 70%);
  padding-left:168px;
}
.blade-icon{
  position:absolute; left:56px; top:50%; transform:translateY(-50%);
  width:34px; height:34px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #d4ffb0, var(--xgreen) 45%, #163a08 100%);
  box-shadow:0 0 16px rgba(140,255,58,0.4);
  transition:box-shadow .3s var(--ease);
}
.blade-row:hover .blade-icon, .blade.open .blade-icon{ box-shadow:0 0 26px rgba(140,255,58,0.75); }

.blade-title{
  font-family:var(--display); font-size:clamp(20px,2.6vw,30px);
  color:var(--bone); letter-spacing:1px; flex:1;
  transition:color .3s var(--ease);
}
.blade-row:hover .blade-title, .blade.open .blade-title{color:var(--xgreen);}
.blade-count{
  font-family:var(--mono); font-size:11px; letter-spacing:2px; color:rgba(140,255,58,0.5);
  white-space:nowrap;
}
.blade-chevron{
  width:9px; height:9px; border-right:1px solid rgba(140,255,58,0.6); border-bottom:1px solid rgba(140,255,58,0.6);
  transform:rotate(-45deg); transition:transform .3s var(--ease); margin-left:4px;
}
.blade.open .blade-chevron{ transform:rotate(45deg); }

.blade-panel{
  max-height:0; overflow:hidden; transition:max-height .5s var(--ease);
  padding-left:148px;
}
.blade.open .blade-panel{ max-height:640px; }
.blade-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;
  padding:6px 10px 30px 0;
}
.blade-grid figure{
  margin:0; aspect-ratio:1; overflow:hidden; border:1px solid rgba(140,255,58,0.18); position:relative;
}
.blade-grid img{
  width:100%; height:100%; object-fit:cover; filter:grayscale(0.25) contrast(1.05);
  transition:transform .5s var(--ease), filter .5s var(--ease);
}
.blade-grid figure:hover img{ transform:scale(1.08); filter:grayscale(0) contrast(1.1); }

@media (max-width:640px){
  .blade-row{padding-left:78px;}
  .blade-row:hover, .blade.open .blade-row{padding-left:88px;}
  .blade-icon{left:16px; width:26px; height:26px;}
  .blade-panel{padding-left:16px;}
  .blade-count{display:none;}
}

/* ============================================================
   INSTAGRAM
   ============================================================ */
#view-insta{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(ellipse 60% 50% at 50% 45%, rgba(182,144,90,0.10), transparent 70%), var(--void);
  text-align:center; padding:0 20px;
}
.insta-eyebrow{
  font-family:var(--body); font-style:italic; letter-spacing:4px; text-transform:uppercase;
  font-size:12px; color:var(--bone-dim); margin-bottom:28px;
}
.insta-btn{
  width:104px; height:104px; border-radius:26px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line);
  background:linear-gradient(160deg, var(--panel-2), var(--panel));
  box-shadow:0 0 0 1px rgba(182,144,90,0.06), 0 20px 40px rgba(0,0,0,0.6);
  transition:transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
}
.insta-btn svg{width:46px; height:46px;}
.insta-btn:hover{
  transform:translateY(-4px) scale(1.04);
  border-color:var(--bronze);
  box-shadow:0 0 50px rgba(182,144,90,0.35), 0 24px 44px rgba(0,0,0,0.6);
}
.insta-handle{
  margin-top:26px; font-family:var(--display); font-size:clamp(20px,2.6vw,26px);
  color:var(--bone); letter-spacing:1px;
}
.insta-tag{
  margin-top:10px; font-family:var(--body); font-style:italic; color:var(--bone-dim); font-size:14px;
}

/* footer note shared by inner pages */
.back-home{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:60;
  font-family:var(--mono); font-size:10px; letter-spacing:3px; text-transform:uppercase;
  color:var(--bone-dim); border:1px solid var(--line); padding:9px 18px;
  background:rgba(10,9,7,0.6); backdrop-filter:blur(2px);
  transition:color .3s, border-color .3s;
}
.back-home:hover{color:var(--bone); border-color:var(--bronze);}
#view-albums .back-home{color:rgba(140,255,58,0.6); border-color:rgba(140,255,58,0.3);}
#view-albums .back-home:hover{color:var(--xgreen); border-color:var(--xgreen);}
</style>
</head>
<body>

<div class="grain"></div>
<div class="vignette"></div>

<header class="site">
  <a class="brand" href="#/" onclick="closeMenu()">HMACK PRODUCTIONS</a>
  <button class="burger" id="burger" aria-label="Open menu" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>
  <nav class="primary" id="nav">
    <a href="#/" data-route="/" onclick="closeMenu()">Home</a>
    <a href="#/albums" data-route="/albums" onclick="closeMenu()">Photo Albums</a>
    <a href="#/instagram" data-route="/instagram" onclick="closeMenu()">Instagram</a>
  </nav>
</header>

<main id="app">

  <!-- ======================= HOME ======================= -->
  <section class="view" id="view-home">

    <!-- EDIT ME: change data-target to the real date this countdown should hit -->
    <div class="hud" id="countdown" data-target="2032-08-25T00:00:00">
      <div class="hud-label"><span class="dot"></span>Countdown</div>
      <div class="hud-grid">
        <div class="hud-unit"><div class="hud-num" id="cd-y">0</div><div class="hud-unitlabel">YRS</div></div>
        <div class="hud-unit"><div class="hud-num" id="cd-d">0</div><div class="hud-unitlabel">DAYS</div></div>
        <div class="hud-unit"><div class="hud-num" id="cd-h">0</div><div class="hud-unitlabel">HRS</div></div>
        <div class="hud-unit"><div class="hud-num" id="cd-m">0</div><div class="hud-unitlabel">MIN</div></div>
      </div>

    <!-- EDIT ME: each .blade is one row/album. Swap the title, count, and image seeds for your real galleries. -->

<script>
/* ---------------- routing ---------------- */
const views = {
  '/': document.getElementById('view-home'),
  '/albums': document.getElementById('view-albums'),
  '/instagram': document.getElementById('view-insta'),
};
const navLinks = document.querySelectorAll('nav.primary a');

function route(){
  const hash = location.hash.replace('#','') || '/';
  const path = views[hash] ? hash : '/';
  Object.values(views).forEach(v=>v.classList.remove('active'));
  views[path].classList.add('active');
  navLinks.forEach(a=>a.classList.toggle('active', a.dataset.route===path));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();

/* ---------------- mobile menu ---------------- */
function toggleMenu(){ document.getElementById('nav').classList.toggle('open'); }
function closeMenu(){ document.getElementById('nav').classList.remove('open'); }

/* ---------------- countdown ---------------- */
(function countdown(){
  const el = document.getElementById('countdown');
  const target = new Date(el.dataset.target).getTime();
  const y = document.getElementById('cd-y');
  const d = document.getElementById('cd-d');
  const h = document.getElementById('cd-h');
  const m = document.getElementById('cd-m');
  function tick(){
    const diff = Math.max(0, target - Date.now());
    const totalMin = Math.floor(diff/60000);
    const years = Math.floor(diff/(365.25*24*3600*1000));
    const remAfterYears = diff - years*365.25*24*3600*1000;
    const days = Math.floor(remAfterYears/(24*3600*1000));
    const hours = Math.floor((diff/(3600*1000))%24);
    const mins = totalMin%60;
    y.textContent = years;
    d.textContent = days;
    h.textContent = String(hours).padStart(2,'0');
    m.textContent = String(mins).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000*30);
})();

/* ---------------- hero slideshow ---------------- */
(function slideshow(){
  const slides = document.querySelectorAll('#offering .slide');
  if(!slides.length) return;
  let i = 0;
  setInterval(()=>{
    slides[i].classList.remove('showing');
    i = (i+1)%slides.length;
    slides[i].classList.add('showing');
  }, 4200);
})();

/* ---------------- albums data + render ---------------- */
/* EDIT ME: this is the single source of truth for the Albums page.
   title      -> shown in blackletter as the row title
   count      -> small caption text on the right
   seed       -> used only for placeholder photos; replace the whole
                 `images` array with your real photo URLs per album. */
const ALBUMS = [
  { title:'Portraits',         count:'24 photos', seed:'portraits' },
  { title:'On Tour',           count:'41 photos', seed:'tour' },
  { title:'Studio Sessions',   count:'18 photos', seed:'studio' },
  { title:'Behind the Scenes', count:'33 photos', seed:'bts' },
  { title:'The Archive',       count:'52 photos', seed:'archive' },
];

const bladesEl = document.getElementById('blades');
ALBUMS.forEach((album, idx)=>{
  const images = Array.from({length:8}, (_,n)=>`https://picsum.photos/seed/${album.seed}${n}/400/400`);
  const blade = document.createElement('div');
  blade.className = 'blade';
  blade.innerHTML = `
    <div class="blade-row">
      <span class="blade-icon"></span>
      <span class="blade-title">${album.title}</span>
      <span class="blade-count">${album.count}</span>
      <span class="blade-chevron"></span>
    </div>
    <div class="blade-panel">
      <div class="blade-grid">
        ${images.map(src=>`<figure><img src="${src}" loading="lazy" alt="${album.title} photo"></figure>`).join('')}
      </div>
    </div>
  `;
  blade.querySelector('.blade-row').addEventListener('click', ()=>{
    const wasOpen = blade.classList.contains('open');
    document.querySelectorAll('.blade.open').forEach(b=>b.classList.remove('open'));
    if(!wasOpen) blade.classList.add('open');
  });
  bladesEl.appendChild(blade);
});
</script>
